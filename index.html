/* ---------- PIN modal ---------- */
function PinModal({ onSuccess, onClose }) {
  const [input, setInput] = useState("");
  const [shake, setShake] = useState(false);

  const press = (d) => {
    if (input.length >= 4 || shake) return;
    const next = input + d;
    setInput(next);
    if (next.length === 4) {
      setTimeout(() => {
        if (next === PIN) {
          onSuccess();
        } else {
          setShake(true);
          setTimeout(() => { setShake(false); setInput(""); }, 450);
        }
      }, 150);
    }
  };

  const keys = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "del"];

  return (
    <div className="absolute inset-0 z-40 flex flex-col items-center justify-end pb-10 bg-black/60 backdrop-blur-xl">
      <button onClick={onClose} className="absolute top-14 right-6 text-white/80 text-sm">취소</button>
      <Lock className="text-white mb-3" size={22} />
      <p className="text-white font-medium mb-5">암호를 입력하세요</p>
      <div className={`flex gap-4 mb-10 ${shake ? "pin-shake" : ""}`}>
        {[0, 1, 2, 3].map((i) => (
          <div
            key={i}
            className={`w-3.5 h-3.5 rounded-full border-2 transition-colors ${
              i < input.length ? (shake ? "bg-red-400 border-red-400" : "bg-white border-white") : "border-white/70"
            }`}
          />
        ))}
      </div>
      <div className="grid grid-cols-3 gap-x-6 gap-y-4">
        {keys.map((k, i) =>
          k === "" ? <div key={i} /> : k === "del" ? (
            <button key={i} onClick={() => setInput(input.slice(0, -1))} className="w-16 h-16 flex items-center justify-center text-white">
              <Delete size={24} />
            </button>
          ) : (
            <button
              key={i}
              onClick={() => press(k)}
              className="w-16 h-16 rounded-full bg-white/20 hover:bg-white/30 active:bg-white/50 text-white text-2xl font-light transition-colors"
            >
              {k}
            </button>
          )
        )}
      </div>
    </div>
  );
}

const CALL_NAMES = ["형사님", "이 형사님", "부팀장", "부팀장님"];
const CALL_REPLIES = ["예, 무슨 일 있습니까?", "예, 검사님.", "연락 보내셨어요?"];

function KakaoApp({ back }) {
  const [messages, setMessages] = useState(INITIAL_CHAT);
  const [text, setText] = useState("");
  const [typing, setTyping] = useState(false);
  const bottomRef = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: "smooth" });
  }, [messages, typing]);

  const pickReply = (msg) => {
    // 더 구체적인 문구("보고 싶습니다")를 먼저 검사합니다.
    if (msg.includes("보고 싶습니다")) return "저도요.";
    if (CALL_NAMES.some((n) => msg.includes(n))) return CALL_REPLIES[Math.floor(Math.random() * CALL_REPLIES.length)];
    return "예, 알겠습니다.";
  };

  const send = () => {
    const msg = text.trim();
    if (!msg) return;
    setMessages((m) => [...m, { id: Date.now(), from: "me", text: msg }]);
    setText("");
    setTyping(true);
    const reply = pickReply(msg);
    setTimeout(() => {
      setTyping(false);
      setMessages((m) => [...m, { id: Date.now() + 1, from: "them", text: reply }]);
    }, 900);
  };

  return (
    <div className="h-full flex flex-col" style={{ background: "#B2C7D9" }}>
      <div className="pt-12 pb-2 px-3 flex items-center gap-2 text-gray-900" style={{ background: "#B2C7D9" }}>
        <button onClick={back}><ChevronLeft size={24} /></button>
        <span className="font-bold">형사님</span>
        <Search size={18} className="ml-auto" />
      </div>
      <div className="flex-1 overflow-y-auto px-3 py-2 space-y-2">
        <p className="mx-auto w-fit text-xs text-white bg-black/20 rounded-full px-3 py-0.5">2026년 10월 28일 수요일</p>
        {messages.map((m) =>
          m.from === "me" ? (
            <div key={m.id} className="flex justify-end">
              <div className="max-w-56 rounded-2xl rounded-tr-sm px-3 py-2 text-sm text-gray-900" style={{ background: "#FEE500" }}>{m.text}</div>
            </div>
          ) : (
            <div key={m.id} className="flex items-start gap-2">
              <img src={DETECTIVE_PROFILE} alt="형사님" className="w-9 h-9 rounded-2xl object-cover shrink-0" />
              <div>
                <p className="text-xs text-gray-700 mb-0.5">형사님</p>
                <div className="max-w-56 rounded-2xl rounded-tl-sm px-3 py-2 text-sm text-gray-900 bg-white">{m.text}</div>
              </div>
            </div>
          )
        )}
        {typing && (
          <div className="flex items-start gap-2">
            <img src={DETECTIVE_PROFILE} alt="형사님" className="w-9 h-9 rounded-2xl object-cover shrink-0" />
            <div className="rounded-2xl rounded-tl-sm px-3 py-2 text-sm text-gray-400 bg-white">입력 중…</div>
          </div>
        )}
        <div ref={bottomRef} />
      </div>
      <div className="bg-white px-3 pt-2 pb-8 flex items-center gap-2">
        <input
          value={text}
          onChange={(e) => setText(e.target.value)}
          onKeyDown={(e) => e.key === "Enter" && send()}
          placeholder="메시지 입력"
          className="flex-1 bg-gray-100 rounded-full px-4 py-2 text-sm outline-none"
        />
        <button
          onClick={send}
          disabled={!text.trim()}
          className="w-9 h-9 rounded-full flex items-center justify-center disabled:opacity-40"
          style={{ background: "#FEE500", color: "#3A1D1D" }}
          aria-label="전송"
        >
          <Send size={16} />
        </button>
      </div>
    </div>
  );
}

  if (note) {
    return (
      <div className="h-full bg-yellow-50 flex flex-col">

        title="메모"
        onBack={back}
        right={
          <button onClick={() => { const id = Date.now(); setNotes([{ id, title: "새 메모", body: "" }, ...notes]); setOpenId(id); }} className="text-yellow-600">
            <Plus size={20} />

        }

      <div className="p-4 space-y-2">
        {notes.map((n) => (
          <button key={n.id} onClick={() => setOpenId(n.id)} className="w-full text-left bg-white rounded-xl p-3 shadow-sm">
            <p className="text-sm font-semibold text-gray-900">{n.title}</p>
            <p className="text-xs text-gray-500 truncate">{n.body.split("\n")[0] || "추가 텍스트 없음"}</p>
          </button>
        ))}
      </div>
    </div>
  );
}

function Toggle({ on, set }) {
  return (
    <button onClick={() => set(!on)} className={`w-11 h-6 rounded-full p-0.5 transition-colors ${on ? "bg-green-500" : "bg-gray-300"}`}>
      <div className={`w-5 h-5 rounded-full bg-white shadow transition-transform ${on ? "translate-x-5" : ""}`} />
    </button>
  );
}

function SettingsApp({ back }) {
  const [s, setS] = useState({ plane: false, wifi: true, bt: true, dnd: false, notif: true });
  const rows = [
    ["plane", "비행기 모드", Plane, "bg-orange-500"],
    ["wifi", "Wi-Fi", Wifi, "bg-blue-500"],
    ["bt", "Bluetooth", Bluetooth, "bg-blue-600"],
    ["dnd", "방해 금지", Moon, "bg-indigo-500"],
    ["notif", "알림", Bell, "bg-red-500"],
  ];
  return (
    <div className="h-full bg-gray-100 flex flex-col">
      <AppHeader title="설정" onBack={back} />
      <div className="m-4 bg-white rounded-2xl overflow-hidden">
        {rows.map(([k, label, Icon, bg]) => (
          <div key={k} className="flex items-center gap-3 px-3 py-3 border-b border-gray-100 last:border-0">
            <div className={`w-8 h-8 rounded-lg ${bg} text-white flex items-center justify-center`}><Icon size={16} /></div>
            <span className="flex-1 text-sm text-gray-900">{label}</span>
            <Toggle on={s[k]} set={(v) => setS({ ...s, [k]: v })} />
          </div>
        ))}
      </div>
    </div>
  );
}

function WeatherApp({ back }) {
  const hours = [["지금", 18], ["15시", 20], ["18시", 17], ["21시", 14], ["00시", 12]];
  return (
    <div className="h-full text-white flex flex-col" style={{ background: "linear-gradient(180deg,#38bdf8,#6366f1)" }}>
      <div className="pt-12 px-3"><button onClick={back} className="flex items-center text-sm"><ChevronLeft size={20} />홈</button></div>
      <div className="text-center mt-6">
        <p className="text-xl">서울시 송파구</p>
        <p className="text-7xl font-extralight my-2">18°</p>
        <p>구름 조금</p>
      </div>
      <div className="mx-4 mt-8 rounded-2xl bg-white/20 p-4 flex justify-between">
        {hours.map(([h, t]) => (
          <div key={h} className="text-center text-sm"><p className="opacity-80">{h}</p><Sun size={18} className="mx-auto my-2" /><p>{t}°</p></div>
        ))}
      </div>
      <div className="mx-4 mt-3 grid grid-cols-2 gap-3 text-sm">
        <div className="rounded-2xl bg-white/20 p-3 flex items-center gap-2"><Droplets size={16} />습도 54%</div>
        <div className="rounded-2xl bg-white/20 p-3 flex items-center gap-2"><Wind size={16} />바람 3m/s</div>
      </div>
    </div>
  );
}

function DDayApp({ back }) {
  return (
    <div className="h-full bg-gray-900 text-white flex flex-col">
      <div className="pt-12 px-3"><button onClick={back} className="flex items-center text-sm text-blue-400"><ChevronLeft size={20} />홈</button></div>
      <div className="flex-1 flex flex-col items-center justify-center">
        <p className="text-sm text-gray-400 mb-2">D-Day</p>
        <p className="text-6xl font-black">L +231일</p>
      </div>
    </div>
  );
}

function CalendarApp({ back }) {
  const [selected, setSelected] = useState(28);
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  // 2026년 10월은 목요일(4)에 시작합니다.
  const cells = [...Array(4).fill(null), ...Array.from({ length: 31 }, (_, i) => i + 1)];
  const dayName = days[(4 + selected - 1) % 7];

  return (
    <div className="h-full bg-white flex flex-col">
      <AppHeader title="2026년 10월" onBack={back} right={<CalendarDays size={18} className="text-red-500" />} />
      <div className="px-3 pt-3">
        <div className="grid grid-cols-7 text-center text-xs mb-1">
          {days.map((d, i) => (
            <span key={d} className={i === 0 ? "text-red-400" : i === 6 ? "text-blue-400" : "text-gray-400"}>{d}</span>
          ))}
        </div>
        <div className="grid grid-cols-7 gap-y-1">
          {cells.map((d, i) => (
            <button
              key={i}
              disabled={!d}
              onClick={() => setSelected(d)}
              className="h-12 flex flex-col items-center pt-1"
            >
              {d && (
                <>
                  <span
                    className={`w-7 h-7 rounded-full flex items-center justify-center text-sm ${
                      d === 28 ? "bg-red-500 text-white font-bold" : d === selected ? "bg-gray-200 text-gray-900" : i % 7 === 0 ? "text-red-400" : "text-gray-800"
                    }`}
                  >
                    {d}
                  </span>
                  {d === 28 && <span className="mt-0.5 text-xs leading-none font-semibold text-red-500">데이트</span>}
                </>
              )}
            </button>
          ))}
        </div>
      </div>
      <div className="mt-3 mx-3 rounded-2xl bg-gray-50 p-4 flex-1">
        <p className="text-sm font-semibold text-gray-900 mb-3">10월 {selected}일 {dayName}요일</p>
        {selected === 28 ? (
          <div className="flex items-center gap-3 rounded-xl bg-white p-3 border-l-4 border-red-500 shadow-sm">
            <Heart size={18} className="text-red-500" />
            <div>
              <p className="text-sm font-bold text-gray-900">데이트</p>
              <p className="text-xs text-gray-500">종일 일정</p>
            </div>
          </div>
        ) : (
          <p className="text-xs text-gray-400">등록된 일정이 없습니다.</p>
        )}
      </div>
    </div>
  );
}

/* ---------- Home screen ---------- */
function HomeScreen({ open }) {
  return (
    <div className="absolute inset-0 pt-14 px-4" style={{ background: "#000000" }}>
      <Widgets open={open} />
      <div className="grid grid-cols-4 gap-y-5 mt-6">
        <AppIcon label="인터넷" Icon={Globe} bg="#4F46E5" onClick={() => open("browser")} />
        <AppIcon label="카카오톡" Icon={MessageCircle} bg="#FEE500" fg="#3A1D1D" badge={3} onClick={() => open("kakao")} />
      </div>
      <div className="absolute bottom-7 inset-x-3 h-20 rounded-3xl bg-white/25 backdrop-blur-xl border border-white/30 flex items-center justify-around">
        <AppIcon hideLabel Icon={Phone} bg="#34C759" badge={5} onClick={() => open("phone")} />
        <AppIcon hideLabel Icon={MessageSquare} bg="#0A84FF" badge={7} onClick={() => open("messages")} />
        <AppIcon hideLabel Icon={StickyNote} bg="#FBBF24" fg="#78350F" onClick={() => open("memo")} />
        <AppIcon hideLabel Icon={Settings} bg="#6B7280" onClick={() => open("settings")} />
      </div>
    </div>
  );
}

/* ---------- Root ---------- */
function PhoneSimulator() {
  const [locked, setLocked] = useState(true);
  const [showPin, setShowPin] = useState(false);
  const [app, setApp] = useState(null);
  const [now, setNow] = useState(new Date());

  useEffect(() => {
    const id = setInterval(() => setNow(new Date()), 1000);
    return () => clearInterval(id);
  }, []);

  const time = now.toLocaleTimeString("ko-KR", { hour: "numeric", minute: "2-digit", hour12: false });
  const goHome = () => setApp(null);
  const lightStatus = locked || !app || ["weather", "dday"].includes(app);

  const apps = {
    browser: BrowserApp, kakao: KakaoApp, phone: PhoneApp, messages: MessagesApp,
    memo: MemoApp, settings: SettingsApp, weather: WeatherApp, dday: DDayApp, calendar: CalendarApp,
  };
  const Current = app ? apps[app] : null;

  return (
    <div className="min-h-screen w-full bg-slate-200 flex items-center justify-center p-4">
      <style>{`
        @keyframes pinShake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-10px)} 40%{transform:translateX(10px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
        .pin-shake { animation: pinShake 0.45s ease-in-out; }
      `}</style>

      {/* Device shell */}
      <div className="relative">
        <button
          onClick={() => { setLocked(true); setApp(null); setShowPin(false); }}
          aria-label="잠금"
          className="absolute -right-1 top-32 w-1.5 h-16 rounded-r bg-red-900 hover:bg-red-800"
        />
        <div className="rounded-3xl bg-red-800 p-3 shadow-2xl" style={{ borderRadius: 56 }}>
          <div className="relative overflow-hidden bg-black" style={{ width: 340, height: 700, borderRadius: 44 }}>
            {/* Dynamic island */}
            <div className="absolute top-3 left-1/2 -translate-x-1/2 w-28 h-7 rounded-full bg-black z-50 flex items-center justify-end pr-3">
              <div className="w-2.5 h-2.5 rounded-full bg-slate-800" />
            </div>

            <StatusBar time={time} dark={!lightStatus} />

            {/* Screen content */}
            {locked ? (
              <LockScreen time={time} onTap={() => setShowPin(true)} />
            ) : Current ? (
              <div className="absolute inset-0"><Current back={goHome} /></div>
            ) : (
              <HomeScreen open={setApp} />
            )}

            {locked && showPin && (
              <PinModal
                onClose={() => setShowPin(false)}
                onSuccess={() => { setLocked(false); setShowPin(false); }}
              />
            )}

            {/* Home bar / swipe-to-home */}
            <button
              onClick={goHome}
              aria-label="홈으로"
              className="absolute bottom-0 inset-x-0 h-7 z-50 flex items-end justify-center pb-2"
            >
              <div className={`w-32 h-1.5 rounded-full ${lightStatus ? "bg-white/90" : "bg-gray-900"}`} />
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PhoneSimulator />);
</script>
</body>
</html>
